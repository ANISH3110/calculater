<!DOCTYPE html>
<html>
<head>
    <title>My Calculator 🧮</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding-top: 50px;
        }

        .calculator {
            width: 320px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        input {
            width: 90%;
            padding: 15px;
            font-size: 25px;
            text-align: right;
            margin-bottom: 15px;
        }

        button {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 22px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.08);
        }

        .equal {
            width: 135px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>🧮 My Calculator ✨</h1>

        <h3>Welcome! 👋</h3>

        <input type="text" id="display" readonly>

        <br>

        <button onclick="clearDisplay()">AC 🧹</button>
        <button onclick="deleteLast()">⌫</button>
        <button onclick="add('/')">÷</button>
        <button onclick="add('*')">×</button>

        <br>

        <button onclick="add('7')">7️⃣</button>
        <button onclick="add('8')">8️⃣</button>
        <button onclick="add('9')">9️⃣</button>
        <button onclick="add('-')">➖</button>

        <br>

        <button onclick="add('4')">4️⃣</button>
        <button onclick="add('5')">5️⃣</button>
        <button onclick="add('6')">6️⃣</button>
        <button onclick="add('+')">➕</button>

        <br>

        <button onclick="add('1')">1️⃣</button>
        <button onclick="add('2')">2️⃣</button>
        <button onclick="add('3')">3️⃣</button>
        <button onclick="calculate()">=</button>

        <br>

        <button onclick="add('0')">0️⃣</button>
        <button onclick="add('.')">.</button>

    </div>

<script>
function add(value) {
    document.getElementById("display").value += value;
}

function clearDisplay() {
    document.getElementById("display").value = "";
}

function deleteLast() {
    let display = document.getElementById("display");
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        document.getElementById("display").value =
            eval(document.getElementById("display").value);
    } catch {
        document.getElementById("display").value = "Error ❌";
    }
}
</script>

</body>
</html>
